name: sendrift

services:
  postgres:
    image: postgres:16-alpine
    container_name: sendrift-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sendrift_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sendrift_local_password_only}
      POSTGRES_DB: ${POSTGRES_DB:-sendrift}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sendrift_user} -d ${POSTGRES_DB:-sendrift}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-10-02T17-50-41Z
    container_name: sendrift-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-sendrift_local_minio_access}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-sendrift_local_minio_secret_key}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    container_name: sendrift-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 $${S3_ACCESS_KEY:-sendrift_local_minio_access} $${S3_SECRET_KEY:-sendrift_local_minio_secret_key};
      /usr/bin/mc mb --ignore-existing local/$${S3_BUCKET_NAME:-sendrift-files};
      /usr/bin/mc anonymous set none local/$${S3_BUCKET_NAME:-sendrift-files};
      exit 0;
      "
    restart: "no"

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: sendrift-api
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}
      POSTGRES_USER: ${POSTGRES_USER:-sendrift_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sendrift_local_password_only}
      POSTGRES_DB: ${POSTGRES_DB:-sendrift}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sendrift_user}:${POSTGRES_PASSWORD:-sendrift_local_password_only}@postgres:5432/${POSTGRES_DB:-sendrift}
      DATABASE_SYNC_URL: postgresql://${POSTGRES_USER:-sendrift_user}:${POSTGRES_PASSWORD:-sendrift_local_password_only}@postgres:5432/${POSTGRES_DB:-sendrift}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-sendrift_local_minio_access}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-sendrift_local_minio_secret_key}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-sendrift-files}
      S3_REGION: ${S3_REGION:-us-east-1}
      MAX_FILE_SIZE_BYTES: ${MAX_FILE_SIZE_BYTES:-104857600}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: sendrift-worker
    command: ["python", "-m", "app.worker.cleanup"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_USER: ${POSTGRES_USER:-sendrift_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sendrift_local_password_only}
      POSTGRES_DB: ${POSTGRES_DB:-sendrift}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sendrift_user}:${POSTGRES_PASSWORD:-sendrift_local_password_only}@postgres:5432/${POSTGRES_DB:-sendrift}
      DATABASE_SYNC_URL: postgresql://${POSTGRES_USER:-sendrift_user}:${POSTGRES_PASSWORD:-sendrift_local_password_only}@postgres:5432/${POSTGRES_DB:-sendrift}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-sendrift_local_minio_access}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-sendrift_local_minio_secret_key}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-sendrift-files}
      S3_REGION: ${S3_REGION:-us-east-1}
      MAX_FILE_SIZE_BYTES: ${MAX_FILE_SIZE_BYTES:-104857600}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: sendrift-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
